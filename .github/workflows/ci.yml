name: Dashem Commerce OS CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    name: Backend tests with PostgreSQL RLS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dashem_pos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d dashem_pos_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/dashem_pos_test
      SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      ENVIRONMENT: test
      AUTH_MODE: disabled
      TEST_BASE_URL: http://127.0.0.1:8002
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - name: Start API
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8002 > /tmp/dashem-api.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8002/health && exit 0
            sleep 1
          done
          cat /tmp/dashem-api.log
          exit 1
      - run: python -m pytest tests -q

  alembic:
    name: Alembic canonical schema
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dashem_alembic_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d dashem_alembic_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/dashem_alembic_test
      SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      ENVIRONMENT: test
      AUTH_MODE: disabled
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Upgrade, downgrade and rebuild schema
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Reject model/schema drift
        run: alembic check
