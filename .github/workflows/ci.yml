name: Dashem Commerce OS CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  backend:
    name: Backend tests with PostgreSQL RLS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dashem_pos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d dashem_pos_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/dashem_pos_test
      SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      ENVIRONMENT: test
      AUTH_MODE: disabled
      TEST_BASE_URL: http://127.0.0.1:8002
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - name: Start API
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8002 > /tmp/dashem-api.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8002/health && exit 0
            sleep 1
          done
          cat /tmp/dashem-api.log
          exit 1
      - run: python -m pytest tests -q

  alembic:
    name: Alembic canonical schema
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dashem_alembic_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d dashem_alembic_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/dashem_alembic_test
      SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      ENVIRONMENT: test
      AUTH_MODE: disabled
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Upgrade, downgrade and rebuild schema
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Reject model/schema drift
        run: alembic check
      - name: Demonstrate backup and restore
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          marker="restore-${GITHUB_SHA}"
          psql -h 127.0.0.1 -U postgres -d dashem_alembic_test -v ON_ERROR_STOP=1 \
            -c "INSERT INTO service_heartbeats(service_key,status,details,last_seen_at,updated_at) VALUES ('$marker','HEALTHY','{}',now(),now())"
          started_at=$(date +%s)
          pg_dump -h 127.0.0.1 -U postgres -d dashem_alembic_test --format=custom --file=/tmp/dashem.restore.dump
          createdb -h 127.0.0.1 -U postgres dashem_restore_test
          pg_restore -h 127.0.0.1 -U postgres -d dashem_restore_test --no-owner --exit-on-error /tmp/dashem.restore.dump
          restored=$(psql -h 127.0.0.1 -U postgres -d dashem_restore_test -Atc "SELECT count(*) FROM service_heartbeats WHERE service_key='$marker'")
          source_revision=$(psql -h 127.0.0.1 -U postgres -d dashem_alembic_test -Atc "SELECT version_num FROM alembic_version")
          revision=$(psql -h 127.0.0.1 -U postgres -d dashem_restore_test -Atc "SELECT version_num FROM alembic_version")
          elapsed=$(( $(date +%s) - started_at ))
          test "$restored" = "1"
          test "$revision" = "$source_revision"
          test "$elapsed" -lt 3600
          echo "Restore verified in ${elapsed}s at revision ${revision}; RPO=0 for the marker transaction."

  operational-e2e:
    name: Operational access E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dashem_oa4_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d dashem_oa4_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/dashem_oa4_test
      DATABASE_ADMIN_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/dashem_oa4_test
      SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      AUTH_TEST_SECRET: ci-only-auth-test-secret-with-at-least-32-characters
      ENVIRONMENT: test
      AUTH_MODE: test
      TEST_BASE_URL: http://127.0.0.1:8003
      VITE_API_URL: http://127.0.0.1:8003
      OA4_APP_URL: http://127.0.0.1:5173
      OA4_API_URL: http://127.0.0.1:8003
      OA4_FIXTURE_PATH: ${{ github.workspace }}/.tmp/oa4-fixture.json
      OA4_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/oa4
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python -m alembic upgrade head
        working-directory: backend
      - name: Seed isolated operational fixture
        run: python tests/support/seed_operational_acceptance.py --output "$OA4_FIXTURE_PATH"
        working-directory: backend
      - name: Start API and frontend
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8003 > /tmp/dashem-oa4-api.log 2>&1 &
          npm --prefix frontend run dev -- --host 127.0.0.1 > /tmp/dashem-oa4-web.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8003/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:5173/operate >/dev/null \
              && exit 0
            sleep 1
          done
          cat /tmp/dashem-oa4-api.log
          cat /tmp/dashem-oa4-web.log
          exit 1
      - run: npm run test:e2e:operational
        working-directory: frontend
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: oa4-operational-e2e-failure
          path: artifacts/oa4
          if-no-files-found: ignore
