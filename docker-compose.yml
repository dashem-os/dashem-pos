name: dashem_pos

services:
  dashem-pos-db:
    image: postgres:15-alpine
    container_name: dashem-pos-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dashem_pos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-dashem_pos}
    ports:
      - "${POSTGRES_PORT:-5437}:5432"
    volumes:
      - postgres_pos_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-dashem_pos} -d $${POSTGRES_DB:-dashem_pos}"]
      interval: 3s
      timeout: 3s
      retries: 5

  dashem-pos-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dashem-pos-backend
    ports:
      - "${BACKEND_PORT:-8002}:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dashem_pos}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@dashem-pos-db:5432/${POSTGRES_DB:-dashem_pos}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      # Local prototype compatibility only. Production is forced to "required"
      # by Settings validation and must configure SUPABASE_URL.
      AUTH_MODE: ${AUTH_MODE:-disabled}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_JWT_AUDIENCE: ${SUPABASE_JWT_AUDIENCE:-authenticated}
    volumes:
      - ./backend:/app
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      dashem-pos-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  dashem-pos-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dashem-pos-worker
    command: ["python", "-m", "app.workers.outbox_worker"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dashem_pos}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@dashem-pos-db:5432/${POSTGRES_DB:-dashem_pos}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      AUTH_MODE: ${AUTH_MODE:-disabled}
      SUPABASE_URL: ${SUPABASE_URL:-}
    volumes:
      - ./backend:/app
    depends_on:
      dashem-pos-backend:
        condition: service_healthy

volumes:
  postgres_pos_data:
